<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUNDAJAWA TUBE</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0a0a;color:#fff}.player{aspect-ratio:16/9;background:#000 url(https://images.unsplash.com/photo-1518709268805-4e9042af9f23) center/cover;position:relative}.sub{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#000c;padding:6px 12px;border-radius:6px;color:#fff;font-weight:700;font-size:12px}.card{background:#151515;margin:10px;border-radius:12px;overflow:hidden}.thumb{height:110px;background-size:cover}.badge{background:#ff3b30;font-size:9px;padding:3px 6px;border-radius:4px;display:inline-block;margin:6px}.voice{display:flex;gap:4px;padding:8px}.vbtn{flex:1;font-size:10px;padding:8px;border-radius:20px;border:1px solid #444;background:#222;color:#fff}.vbtn.active{background:#ff3b30}input{width:100%;background:#1e1e1e;border:1px solid #333;color:#fff;padding:12px;border-radius:30px;margin:10px 0}</style></head><body>
<div style="padding:12px;background:#111"><b style="color:#ff3b30">▶ SUNDAJAWA TUBE v4</b></div>
<div class="player"><div class="sub" id="sub">Si eta musuhna, gas hajar beo!</div></div>
<div style="padding:10px"><h4>Laga: Perang Gang Gelap EP12</h4><p style="font-size:11px;opacity:.6">Action • Auto Dubbing ON</p><div style="display:flex;gap:6px;margin-top:8px"><button class="vbtn active" onclick="setV('sunda')">🔊 SUNDA</button><button class="vbtn" onclick="setV('jawa')">🔊 JAWA</button><button class="vbtn" onclick="speak()">▶️ TEST SUARA</button></div></div>
<input id="q" placeholder="🔍 Cari film hantu, action..." oninput="filter()">
<div id="grid">
<div class="card" data-t="action laga perang gang"><div class="thumb" style="background-image:url(https://images.unsplash.com/photo-1518709268805-4e9042af9f23)"><span class="badge">ACTION</span></div><h5 style="padding:8px;font-size:12px">Laga: Perang Gang Gelap EP12 [Sunda]</h5><div class="voice"><button class="vbtn">SUNDA</button><button class="vbtn">JAWA</button></div></div>
<div class="card" data-t="hantu leuweung saung kosong"><div class="thumb" style="background-image:url(https://images.unsplash.com/photo-1509248961158-e32f33ba5f3b)"><span class="badge">HANTU</span></div><h5 style="padding:8px;font-size:12px">Hantu Leuweung: Saung Kosong [Sunda]</h5><div class="voice"><button class="vbtn">SUNDA</button><button class="vbtn">JAWA</button></div></div>
<div class="card" data-t="kunti korea jawa hantu"><div class="thumb" style="background-image:url(https://images.unsplash.com/photo-1535666669445-7495384c8f8d)"><span class="badge">HANTU</span></div><h5 style="padding:8px;font-size:12px">Mbak Kunti Korea Nyasar Jawa [Jawa]</h5><div class="voice"><button class="vbtn">JAWA</button><button class="vbtn">SUNDA</button></div></div>
</div>
<script>let ct="Si eta musuhna, gas hajar beo!";function setV(v){let s=document.getElementById('sub');if(v=='sunda'){s.innerText="Si eta musuhna, gas hajar beo!";ct="Si eta musuhna, gas hajar beo, kumaha euy!"}else{s.innerText="Musuh e kui, gas hajar lur!";ct="Musuh e kui, gas hajar lur, piye iki?"}}function speak(){let u=new SpeechSynthesisUtterance(ct);u.lang='id-ID';speechSynthesis.speak(u)}function filter(){let q=document.getElementById('q').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>{c.style.display=c.dataset.t.includes(q)?'block':'none'})}</script>
</body></html>
